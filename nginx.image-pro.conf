server {
  listen 80;
  server_name _;
  client_max_body_size 100M;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # API: strip /image-pro before proxying to Flask
  location /image-pro/api/ {
    proxy_pass http://127.0.0.1:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
  }

  # Hashed Next.js assets — cache aggressively (filenames carry content hashes)
  location ~* ^/image-pro/_next/static/.*\.(css|js|woff2?)$ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # Other static assets (CH branding files, logo, public/ images)
  location ~* ^/image-pro/.*\.(png|jpg|jpeg|svg|webp|woff2?|css|js)$ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    expires 1h;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Frontend: also proxy to Flask, which serves the Next.js export from static_site/.
  # Frontend was built with basePath: '/image-pro', so emitted URLs include the prefix.
  location /image-pro/ {
    proxy_pass http://127.0.0.1:5000/image-pro/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
